name: CI/CD - Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: 20.11.0
  NPM_VERSION: 10.8.2

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── CODE QUALITY ────────────────────────────────────────────
  # Files: eslint.config.js, src/**
  lint:
    name: 🔍 Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - run: npm ci
      - run: npm run lint

  # ─── SECURITY ────────────────────────────────────────────────
  # Files: package.json, package-lock.json
  security:
    name: � Security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm audit fix --dry-run
      
      - name: OWASP Check
        uses: dependency-check/Dependency-Check_Action@v1.1.1
        with:
          project: 'Azan-Prayer-F'
          path: '.'
          format: 'JSON'
          args: --enableExperimental
      
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: reports/
          retention-days: 5

  # ─── BUILD APPLICATION ───────────────────────────────────────
  # Files: vite.config.js, package.json, src/**, index.html
  build:
    name: � Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - run: npm ci
      - run: npm run build
      
      - name: Verify artifacts
        run: |
          [ -d dist ] || (echo "❌ dist not found"; exit 1)
          [ -f dist/index.html ] || (echo "❌ index.html not found"; exit 1)
          [ -f dist/sw.js ] || (echo "⚠️ service worker missing"; exit 0)
          echo "✅ Build OK"
      
      - name: Check size
        run: |
          SIZE=$(du -sh dist/ | cut -f1)
          echo "📦 Size: $SIZE"
          BYTES=$(du -s dist/ | cut -f1)
          [ $BYTES -lt 1000000 ] || echo "⚠️ Exceeds 1MB"
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 5

  # ─── PERFORMANCE ─────────────────────────────────────────────
  # Files: lighthouserc.json, dist/
  performance:
    name: ⚡ Performance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Start server
        run: |
          npx serve@latest -s dist -l 3000 &
          sleep 3
      
      - name: Wait ready
        run: |
          for i in {1..30}; do
            curl -f http://localhost:3000 && exit 0
            sleep 1
          done
          echo "❌ Server not ready"; exit 1
      
      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v9
        with:
          uploadArtifacts: true
          runs: 3
          configPath: ./lighthouserc.json
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── DOCKER BUILD TEST ───────────────────────────────────────
  # Files: Dockerfile, Dockerfile.dev, docker-compose.yml
  docker:
    name: 🐳 Docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      
      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── STATUS REPORT ───────────────────────────────────────────
  # Summary of all job results
  status:
    name: ✅ Status
    runs-on: ubuntu-latest
    needs: [lint, security, build, performance, docker]
    if: always()
    permissions:
      contents: read

    steps:
      - name: Report
        run: |
          echo "## CI Results" >> $GITHUB_STEP_SUMMARY
          echo "- Lint: ${{ needs.lint.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Security: ${{ needs.security.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Build: ${{ needs.build.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Performance: ${{ needs.performance.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Docker: ${{ needs.docker.result }}" >> $GITHUB_STEP_SUMMARY
      
      - name: Fail if required jobs failed
        if: |
          needs.lint.result == 'failure' ||
          needs.build.result == 'failure' ||
          needs.security.result == 'failure'
        run: exit 1
