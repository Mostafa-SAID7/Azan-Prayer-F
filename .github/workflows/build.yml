name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: 24.0.0

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - run: npm install --legacy-peer-deps --ignore-scripts
      - run: npm run build
      
      - name: Verify artifacts
        run: |
          [ -d dist ] || (echo "Build failed"; exit 1)
          [ -f dist/index.html ] || (echo "index.html missing"; exit 1)
          [ -f dist/sw.js ] || echo "Service worker missing"
      
      - name: Check size
        run: |
          SIZE=$(du -sh dist/ | cut -f1)
          echo "Bundle: $SIZE"
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 5
