name: CD - Netlify Preview Deploy

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: 20.11.0

concurrency:
  group: preview-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  preview-deploy:
    name: 🔍 Preview Deploy to Netlify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          VITE_ALADHAN_API_URL: ${{ secrets.VITE_ALADHAN_API_URL }}
          VITE_DEFAULT_CITY: ${{ secrets.VITE_DEFAULT_CITY }}
          VITE_DEFAULT_COUNTRY: ${{ secrets.VITE_DEFAULT_COUNTRY }}

      - name: Deploy preview to Netlify
        run: |
          npx netlify-cli@14.11.0 deploy --dir=./dist --site=${{ secrets.NETLIFY_SITE_ID }} --auth=${{ secrets.NETLIFY_AUTH_TOKEN }} --json > deploy-output.json
          echo "deploy-output=$(cat deploy-output.json)" >> $GITHUB_ENV
        env:
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}

      - name: Extract preview URL
        run: |
          PREVIEW_URL=$(echo "${{ env.deploy-output }}" | jq -r '.deploy_url')
          echo "preview-url=$PREVIEW_URL" >> $GITHUB_OUTPUT
          echo "PREVIEW_URL=$PREVIEW_URL" >> $GITHUB_ENV
        id: netlify

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request' && env.PREVIEW_URL != ''
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const deployUrl = process.env.PREVIEW_URL;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 **Preview deployed to Netlify**\n\n[🔗 View Preview](${deployUrl})\n\n📊 [Compare with production](https://azan-prayer.netlify.app)`
            });

      - name: Verify preview deployment
        run: |
          PREVIEW_URL="${{ env.PREVIEW_URL }}"
          for i in {1..30}; do
            if curl -f "$PREVIEW_URL" > /dev/null 2>&1; then
              echo "✅ Preview is live at: $PREVIEW_URL"
              exit 0
            fi
            echo "Attempt $i/30: Waiting for preview to be live..."
            sleep 2
          done
          echo "⚠️ Preview may take longer to be available"
